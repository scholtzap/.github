name: pr-gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get("PR_BODY") or ""
          body = body.replace("\r\n", "\n").replace("\r", "\n")
          lines = body.split("\n")
          nonempty = [line for line in lines if line.strip()]
          errors = []
          if not nonempty or not nonempty[0].lstrip().startswith("Done when:"):
              errors.append("first non-empty line must start with 'Done when:'")
          task_id = re.compile(r"[A-Z0-9]+(?:-[A-Z0-9]+)+")
          found_task = False
          for line in lines:
              if "Task:" not in line:
                  continue
              scrubbed = re.sub(r"e\.g\.\s*[A-Z0-9]+(?:-[A-Z0-9]+)+", "", line)
              after = scrubbed.split("Task:", 1)[1]
              if task_id.search(after):
                  found_task = True
                  break
          if not found_task:
              errors.append("missing Task: line with a board Task ID like PROJECT-TASK")
          follow = re.compile(r"follow-up:\s*#\d+")
          for number, line in enumerate(lines, 1):
              if "- [ ]" in line and not follow.search(line):
                  errors.append(
                      f"line {number} has an unticked item without follow-up: #<number>"
                  )
          if errors:
              print("pr-gate failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)
          print("pr-gate passed")
          PY
